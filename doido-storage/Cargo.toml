[package]
name = "doido-storage"
description = "Attached-file storage — blobs, polymorphic attachments and pluggable services (disk, memory, S3, Cloudflare R2, Azure Blob) in ActiveStorage fashion for Doido."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
doido-model = { workspace = true, default-features = false }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
axum.workspace = true                  # serving handlers (redirect / proxy / direct upload)
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
uuid.workspace = true                  # blob keys
chrono.workspace = true
tracing.workspace = true

# Integrity + signing (all already in the workspace lock, digest 0.11 ecosystem).
md-5 = "0.11"
sha2.workspace = true
hmac.workspace = true
base64.workspace = true

# Optional backends, enabled by the matching feature. We opt out of the SDK's
# default features to drop its *legacy* rustls 0.21 client (the `rustls` /
# `tls-rustls` feature), keeping only the modern `default-https-client`
# (hyper 1 + rustls 0.23 + aws-lc-rs). This dedupes rustls with the rest of the
# workspace and avoids the rustls-webpki 0.101 advisories; no system OpenSSL.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "sigv4a",
    "http-1x",
    "default-https-client",
], optional = true }
# Azure stays on the 0.21 SDK: the new azure_storage_blob 1.x only supports Entra
# ID (Azure AD) token auth, dropping the account access-key auth doido relies on.
# The advisories from its azure_core 0.21 chain are tracked in .cargo/audit.toml.
azure_storage = { version = "0.21", optional = true }
azure_storage_blobs = { version = "0.21", optional = true }
gcloud-storage = { version = "1.3", default-features = false, features = [
    "rustls-tls",
    "auth",
    "jwt-rust-crypto",
], optional = true }
imagesize = { version = "0.15", optional = true }
doido-jobs = { workspace = true, optional = true }

[features]
default = []
sqlite = ["doido-model/sqlite"]
postgres = ["doido-model/postgres"]
mysql = ["doido-model/mysql"]
storage-s3 = ["dep:aws-sdk-s3"]        # covers both the `s3` and `r2` service kinds
storage-azure = ["dep:azure_storage", "dep:azure_storage_blobs"]
storage-gcs = ["dep:gcloud-storage"]   # Google Cloud Storage
storage-image = ["dep:imagesize"]      # image dimension analyzer
storage-jobs = ["dep:doido-jobs"]      # purge_later / analyze_later via doido-jobs

[dev-dependencies]
doido-model = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["macros", "rt", "fs", "io-util"] }
tempfile.workspace = true
serde_json.workspace = true
tower = { workspace = true }           # ServiceExt::oneshot for handler tests
axum.workspace = true
