name: Release

# Releases publish ONLY from a `release/X.Y.Z` branch whose tree already carries
# the version bump + stamped changelogs (produced by `make release-prep`). The
# workflow verifies that committed state, publishes to crates.io, tags
# `vX.Y.Z`, and builds the GitHub Release body from the per-crate changelogs.
# See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver to publish (required; no leading v, e.g. 0.1.0; when unstable=true use a suffix, e.g. 0.0.25-test.1). Must match the committed release branch."
        required: true
        type: string
      unstable:
        description: "Unstable / test release — GitHub pre-release (not latest); clean up with release-delete workflow + make yank"
        required: true
        type: boolean
        default: false
      dry_run:
        description: "Dry run — skip publish and GitHub Release creation"
        required: true
        type: boolean
        default: false

jobs:
  guard:
    name: Guard — release branch only
    runs-on: ubuntu-latest
    steps:
      - name: Require a release/* branch
        run: |
          case "${GITHUB_REF_NAME}" in
            release/*) echo "ok: dispatched from ${GITHUB_REF_NAME}" ;;
            *) echo "::error::Release must be dispatched from a release/* branch (got '${GITHUB_REF_NAME}'). See RELEASING.md." ; exit 1 ;;
          esac

  version:
    name: Verify version
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert committed version matches input
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The release branch already committed the bump (make release-prep), so
          # the tree is the source of truth — no in-CI mutation or manifest packing.
          committed="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          if [ "$committed" != "$VERSION" ]; then
            echo "::error::Committed workspace version ($committed) != requested ($VERSION). Run 'make release-prep VERSION=$VERSION' on the release branch and commit before releasing."
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "==> release version: $VERSION (matches committed tree)"

  publish:
    name: Publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == false }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UNSTABLE: ${{ inputs.unstable }}
        run: |
          tag="v${VERSION}"
          # Idempotent: a re-run of an already-tagged release must not fail or
          # move an existing tag (release tags are immutable once published).
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "==> ${tag} already exists on origin; leaving it untouched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${UNSTABLE}" = "true" ]; then
            tag_msg="Release ${tag} (unstable)"
          else
            tag_msg="Release ${tag}"
          fi
          git tag -a "${tag}" -m "${tag_msg}"
          git push origin "refs/tags/${tag}"
          echo "==> tagged $(git rev-parse HEAD) as ${tag}"
      - name: Assemble release notes from changelogs
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UNSTABLE: ${{ inputs.unstable }}
        run: |
          if [ "${UNSTABLE}" = "true" ]; then
            {
              echo "**Unstable / test release** — not promoted to \`latest\`. Delete this release and run \`make yank VERSION=${VERSION}\` when done."
              echo
            } > release-notes.md
          else
            : > release-notes.md
          fi
          ./scripts/release-notes.sh "$VERSION" >> release-notes.md
          {
            printf '\n## Install\n\n```bash\n'
            printf 'cargo install doido --version %s --locked\n' "$VERSION"
            printf '```\n'
          } >> release-notes.md
          echo "----- release-notes.md -----"; cat release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ inputs.unstable }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
