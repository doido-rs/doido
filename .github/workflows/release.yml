name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver to publish (required; no leading v, e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run — skip publish and GitHub Release creation"
        required: true
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: make install-check

  version:
    name: Resolve version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo install cargo-workspaces --locked
      - name: Set workspace version
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/bump-workspace-version.sh
      - name: Pack versioned Cargo manifests
        run: ./scripts/pack-cargo-manifests.sh cargo-manifests.tar.gz
      - name: Upload versioned manifests
        uses: actions/upload-artifact@v4
        with:
          name: cargo-manifests
          path: cargo-manifests.tar.gz

  publish:
    name: Publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-manifests
      - run: ./scripts/unpack-cargo-manifests.sh cargo-manifests.tar.gz
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    name: Build — ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            ext: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            ext: ""
          - runner: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            ext: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-manifests
      - run: ./scripts/unpack-cargo-manifests.sh cargo-manifests.tar.gz
        shell: bash
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (ARM Linux only)
        if: ${{ matrix.use_cross }}
        run: cargo install cross --locked
      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --bin doido --target ${{ matrix.target }}
      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --release --bin doido --target ${{ matrix.target }}
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/doido${{ matrix.ext }}"
          dest="dist/doido-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dest"
          chmod +x "$dest"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doido-${{ matrix.target }}
          path: dist/doido-${{ matrix.target }}${{ matrix.ext }}

  release:
    name: GitHub Release
    needs: [version, publish, build]
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == false }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp scripts/install.sh scripts/install.ps1 release-assets/
          chmod +x release-assets/install.sh
          find artifacts -type f \( -name 'doido-*' ! -name 'cargo-manifests.tar.gz' \) | while read -r f; do
            cp "$f" "release-assets/$(basename "$f")"
          done
          ls -la release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body: |
            ## Install

            **Linux / macOS**

            ```bash
            curl -fsSL https://github.com/doido-rs/doido/releases/download/v${{ needs.version.outputs.version }}/install.sh | bash
            ```

            Pin a version:

            ```bash
            curl -fsSL https://github.com/doido-rs/doido/releases/download/v${{ needs.version.outputs.version }}/install.sh | DOIDO_VERSION=${{ needs.version.outputs.version }} bash
            ```

            **Windows (PowerShell)**

            ```powershell
            irm https://github.com/doido-rs/doido/releases/download/v${{ needs.version.outputs.version }}/install.ps1 | iex
            ```

            Binaries are also attached as `doido-<target>` for manual install.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
