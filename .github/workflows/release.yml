name: Release

# Releases publish ONLY from a `release/X.Y.Z` branch whose tree already carries
# the version bump + stamped changelogs (produced by `make release-prep`). The
# workflow verifies that committed state, publishes crates.io + binaries, tags
# `vX.Y.Z`, and builds the GitHub Release body from the per-crate changelogs.
# See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver to publish (required; no leading v, e.g. 0.1.0). Must match the committed release branch."
        required: true
        type: string
      dry_run:
        description: "Dry run — skip publish and GitHub Release creation"
        required: true
        type: boolean
        default: false

jobs:
  guard:
    name: Guard — release branch only
    runs-on: ubuntu-latest
    steps:
      - name: Require a release/* branch
        run: |
          case "${GITHUB_REF_NAME}" in
            release/*) echo "ok: dispatched from ${GITHUB_REF_NAME}" ;;
            *) echo "::error::Release must be dispatched from a release/* branch (got '${GITHUB_REF_NAME}'). See RELEASING.md." ; exit 1 ;;
          esac

  test:
    name: Test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: make install-check
      - name: Generator release e2e
        run: make release-e2e
        env:
          CARGO_TARGET_DIR: target/e2e-cargo

  version:
    name: Verify version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert committed version matches input
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The release branch already committed the bump (make release-prep), so
          # the tree is the source of truth — no in-CI mutation or manifest packing.
          committed="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          if [ "$committed" != "$VERSION" ]; then
            echo "::error::Committed workspace version ($committed) != requested ($VERSION). Run 'make release-prep VERSION=$VERSION' on the release branch and commit before releasing."
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "==> release version: $VERSION (matches committed tree)"

  publish:
    name: Publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    name: Build — ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            ext: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            ext: ""
          - runner: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            ext: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (ARM Linux only)
        if: ${{ matrix.use_cross }}
        run: cargo install cross --locked
      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --bin doido --target ${{ matrix.target }}
      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --release --bin doido --target ${{ matrix.target }}
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/doido${{ matrix.ext }}"
          dest="dist/doido-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dest"
          chmod +x "$dest"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doido-${{ matrix.target }}
          path: dist/doido-${{ matrix.target }}${{ matrix.ext }}

  release:
    name: GitHub Release
    needs: [version, publish, build]
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == false }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          # Idempotent: a re-run of an already-tagged release must not fail or
          # move an existing tag (release tags are immutable once published).
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "==> ${tag} already exists on origin; leaving it untouched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "==> tagged $(git rev-parse HEAD) as ${tag}"
      - name: Assemble release notes from changelogs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/release-notes.sh "$VERSION" > release-notes.md
          {
            printf '\n## Install\n\n**Linux / macOS**\n\n```bash\n'
            printf 'curl -fsSL https://github.com/doido-rs/doido/releases/download/v%s/install.sh | bash\n' "$VERSION"
            printf '```\n\nPin a version:\n\n```bash\n'
            printf 'curl -fsSL https://github.com/doido-rs/doido/releases/download/v%s/install.sh | DOIDO_VERSION=%s bash\n' "$VERSION" "$VERSION"
            printf '```\n\n**Windows (PowerShell)**\n\n```powershell\n'
            printf 'irm https://github.com/doido-rs/doido/releases/download/v%s/install.ps1 | iex\n' "$VERSION"
            printf '```\n\nBinaries are also attached as `doido-<target>` for manual install.\n'
          } >> release-notes.md
          echo "----- release-notes.md -----"; cat release-notes.md
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp scripts/install.sh scripts/install.ps1 release-assets/
          chmod +x release-assets/install.sh
          find artifacts -type f -name 'doido-*' | while read -r f; do
            cp "$f" "release-assets/$(basename "$f")"
          done
          ls -la release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
