name: docs-blog

# Build the docs + blog site with Zola and publish it to the organisation
# root-site repo doido-rs/doido-rs.github.io, which GitHub Pages serves at the
# domain root https://doido-rs.github.io/.
# Runs only when the site (or this workflow) changes, plus on manual dispatch.
on:
  push:
    branches: ["master"]
    paths:
      - "docs-blog/**"
      - ".github/workflows/docs-blog.yml"
  workflow_dispatch:

# Only needs to read this repo; the cross-repo push authenticates with a deploy key.
permissions:
  contents: read

# Serialize deploys; don't cancel an in-flight one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prebuilt Zola binary (no compilation). Bump the version to upgrade.
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2

      # base_url is already set to https://doido-rs.github.io in config.toml.
      - name: Build site
        working-directory: docs-blog
        run: zola build

      # Publish the built site to the org root-site repo. That repo is named
      # doido-rs.github.io, so GitHub Pages serves it at the domain root. The
      # cross-repo push authenticates with the ACTIONS_DEPLOY_KEY deploy key
      # (private half stored here as a secret, public half installed on the target).
      - name: Publish to doido-rs.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: doido-rs/doido-rs.github.io
          publish_branch: main
          publish_dir: docs-blog/public
          force_orphan: true
