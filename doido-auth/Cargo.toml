[package]
name = "doido-auth"
description = "Unified authentication for Doido — AuthUser trait, extractors, strategies, and auth generators."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
doido-controller.workspace = true
doido-view.workspace = true
doido-auth-macros = { workspace = true, features = [] }
doido-model = { workspace = true, default-features = false }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid.workspace = true
axum.workspace = true
http.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["sync"] }
ureq.workspace = true
totp-lite = { workspace = true, optional = true }
tracing.workspace = true

[features]
default = ["generators"]
generators = []
auth-2fa = ["dep:totp-lite", "doido-auth-macros/auth-2fa"]
sqlite = ["doido-model/sqlite"]
postgres = ["doido-model/postgres"]
mysql = ["doido-model/mysql"]

[dev-dependencies]
doido-controller = { workspace = true, features = ["sqlite"] }
doido-model = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http-body-util.workspace = true
http.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
