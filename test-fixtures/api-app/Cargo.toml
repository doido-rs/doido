[package]
name = "doido-api-fixture"
version = "0.0.0"
edition = "2021"
publish = false

# Fixture crate: its `config/application.toml` carries `api_only = true`, so the
# route macros expanded inside its integration tests run in API mode. This is the
# only way to exercise API-mode expansion, since the marker is read from the
# manifest dir of the crate being compiled (see doido-controller/macros).

[dev-dependencies]
doido-controller = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
