[package]
name = "doido-cable"
description = "Action Cable analogue: channels, broadcasts, Turbo-friendly pub/sub backends for Doido."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
doido-cable-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
axum = { workspace = true, features = ["ws"] }
futures-util = "0.3"
redis = { workspace = true, optional = true }
doido-model = { workspace = true, optional = true }

[features]
cable-redis = ["dep:redis"]
cable-db = ["dep:doido-model"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
async-trait.workspace = true
serde_json.workspace = true
doido-core.workspace = true
axum = { workspace = true, features = ["ws"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
