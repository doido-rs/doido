[package]
name = "doido"
description = "Rails-inspired Axum framework metacrate exporting routing, MVC, and SeaORM model adapters."
version.workspace = true
license.workspace = true
edition = "2021"

[lib]
name = "doido"
path = "src/lib.rs"

[[bin]]
name = "doido"
path = "src/main.rs"

[dependencies]
doido-core.workspace = true
doido-controller = { workspace = true, default-features = false, features = ["sqlite"] }
doido-model = { workspace = true, default-features = false, features = [
    "cli",
    "sqlite",
    "postgres",
    "mysql",
] }
doido-view.workspace = true
doido-cache.workspace = true
doido-storage.workspace = true
doido-jobs = { workspace = true, default-features = false, features = [
    "cli",
    "jobs-db",
    "jobs-redis",
    "sqlite",
] }
doido-mailer.workspace = true
doido-cable.workspace = true
doido-auth = { workspace = true, optional = true }
doido-generators = { workspace = true, default-features = true }
doido-payments = { version = "0.0.1", optional = true }
clap.workspace = true
figlet-rs.workspace = true
tokio = { workspace = true, features = ["full"] }

[features]
default = ["sqlite", "auth"]
sqlite = [
    "doido-model/sqlite",
    "doido-controller/sqlite",
    "doido-storage/sqlite",
    "doido-cable/sqlite",
    "doido-jobs/sqlite",
]
postgres = [
    "doido-model/postgres",
    "doido-controller/postgres",
    "doido-storage/postgres",
    "doido-cable/postgres",
    "doido-jobs/postgres",
]
mysql = [
    "doido-model/mysql",
    "doido-controller/mysql",
    "doido-storage/mysql",
    "doido-cable/mysql",
    "doido-jobs/mysql",
]
cli = ["doido-model/cli"]
cache-redis = ["doido-cache/cache-redis"]
cache-memcache = ["doido-cache/cache-memcache"]
storage-s3 = ["doido-storage/storage-s3"]
storage-azure = ["doido-storage/storage-azure"]
storage-gcs = ["doido-storage/storage-gcs"]
storage-image = ["doido-storage/storage-image"]
storage-jobs = ["doido-storage/storage-jobs"]
auth = ["dep:doido-auth"]
payments = ["dep:doido-payments", "doido-generators/payments-generators"]
payments-cli = ["payments", "doido-generators/payments-generators-always"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
toml = "0.8"
doido-model = { workspace = true, features = ["sqlite"] }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = true
