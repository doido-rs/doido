[package]
name = "doido"
description = "Rails-inspired Axum framework metacrate exporting routing, MVC, and SeaORM model adapters."
version.workspace = true
license.workspace = true
edition = "2021"

[lib]
name = "doido"
path = "src/lib.rs"

[[bin]]
name = "doido"
path = "src/main.rs"

[dependencies]
doido-core.workspace = true
doido-controller.workspace = true
doido-model = { workspace = true, default-features = false }
doido-view.workspace = true
doido-cache.workspace = true
doido-storage.workspace = true
doido-jobs.workspace = true
doido-mailer.workspace = true
doido-cable.workspace = true
doido-generators.workspace = true
tokio = { workspace = true, features = ["full"] }

[features]
default = ["sqlite"]
sqlite = [
    "doido-model/sqlite",
    "doido-controller/sqlite",
    "doido-storage/sqlite",
    "doido-cable/sqlite",
    "doido-jobs/sqlite",
]
postgres = [
    "doido-model/postgres",
    "doido-controller/postgres",
    "doido-storage/postgres",
    "doido-cable/postgres",
    "doido-jobs/postgres",
]
mysql = [
    "doido-model/mysql",
    "doido-controller/mysql",
    "doido-storage/mysql",
    "doido-cable/mysql",
    "doido-jobs/mysql",
]
# SeaORM migration binary (`db/migration`): `sea_orm_migration::cli::run_cli`.
cli = ["doido-model/cli"]
# Distributed cache backends, selected at runtime via `config/<env>.yml`.
cache-redis = ["doido-cache/cache-redis"]
cache-memcache = ["doido-cache/cache-memcache"]
# Storage service backends and add-ons, selected at runtime via `config/<env>.yml`.
storage-s3 = ["doido-storage/storage-s3"]        # AWS S3 + Cloudflare R2
storage-azure = ["doido-storage/storage-azure"]  # Azure Blob Storage
storage-gcs = ["doido-storage/storage-gcs"]      # Google Cloud Storage
storage-image = ["doido-storage/storage-image"]  # image dimension analyzer
storage-jobs = ["doido-storage/storage-jobs"]    # purge_later / analyze_later

[dev-dependencies]
assert_cmd  = "2"
predicates  = "3"
