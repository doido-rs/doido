[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# Duplicated versions that can't be collapsed without *downgrading* freshly-updated
# crates: the older halves are pinned by transitive deps (sqlx/sea-orm/azure) while
# our crates (and bcrypt) are on the newer ones. The one duplicate we *could* remove
# — a legacy rustls 0.21 stack pulled by aws-sdk-s3's default features — was removed
# by switching to its modern (rustls 0.23) client. The rest are listed here to keep
# `cargo deny` output meaningful; `multiple-versions` stays at "warn".
skip = [
    # transitive-only older majors
    { name = "getrandom", version = "0.2" },      # ring/older transitives vs 0.4 (uuid/rand)
    { name = "heck", version = "0.4" },            # older transitive vs 0.5
    { name = "windows-sys", version = "0.52" },    # older transitive vs 0.61
    { name = "hashbrown", version = "0.16" },      # transitive vs 0.17
    { name = "syn", version = "2" },               # sea-orm/serde use 2; our macros use 3 (accepted)
    # digest 0.10 ecosystem (sqlx) vs 0.11 (our sha2/hmac/md-5 + bcrypt) — structural split
    { name = "base64", version = "0.22" },         # sqlx-core 0.9 vs 0.23 (ours)
    { name = "digest", version = "0.10" },
    { name = "sha2", version = "0.10" },
    { name = "block-buffer", version = "0.10" },
    { name = "crypto-common", version = "0.1" },
    { name = "cpufeatures", version = "0.2" },
]

[advisories]
# Nothing to ignore in the default-feature graph. jsonwebtoken uses `aws_lc_rs`
# (not `rust_crypto`) so RUSTSEC-2023-0071 / `rsa` is not pulled in. Azure-backend
# advisories are scanned by cargo-audit over the full lockfile and documented in
# .cargo/audit.toml.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
