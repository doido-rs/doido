[workspace]
resolver = "2"
members = [
    "doido-core",
    "doido-controller/macros",
    "doido-controller",
    "doido-view",
    "doido-model",
    "doido-cache",
    "doido-storage",
    "doido-jobs/macros",
    "doido-jobs",
    "doido-mailer/macros",
    "doido-mailer",
    "doido-cable/macros",
    "doido-cable",
    "doido-generators",
    "doido-auth",
    "doido",
]

[workspace.package]
version = "0.0.9"
license = "MIT"

# Line-coverage gate (`make coverage-check`). Per-crate enforcement lives in
# scripts/coverage-check.sh; phased rollout plan: harness/coverage-plan.md
[workspace.metadata.coverage-gate]
min-lines-percent = 80.0

# Dev/test build profile tuning. Full DWARF (`debug = 2`, cargo's dev default) is
# a major driver of link-time RAM and target/ disk usage — costly on this 7 GiB
# box. `line-tables-only` keeps file:line info in panic backtraces and coverage
# reports while dropping the heavy variable/type debug data. `[profile.test]`
# inherits from dev, so this covers `cargo test` and `cargo llvm-cov` too.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
# First-party crates: every entry needs `path` *and* `version` so `cargo publish`
# strips `path`, keeps the semver, and resolves from crates.io.
doido = { path = "doido", version = "0.0.9" }
doido-cable = { path = "doido-cable", version = "0.0.9" }
doido-cable-macros = { path = "doido-cable/macros", version = "0.0.9" }
doido-cache = { path = "doido-cache", version = "0.0.9" }
doido-controller = { path = "doido-controller", version = "0.0.9" }
doido-controller-macros = { path = "doido-controller/macros", version = "0.0.9" }
doido-core = { path = "doido-core", version = "0.0.9" }
doido-generators = { path = "doido-generators", version = "0.0.9" }
doido-auth = { path = "doido-auth", version = "0.0.9" }
doido-jobs = { path = "doido-jobs", version = "0.0.9" }
doido-jobs-macros = { path = "doido-jobs/macros", version = "0.0.9" }
doido-mailer = { path = "doido-mailer", version = "0.0.9" }
doido-mailer-macros = { path = "doido-mailer/macros", version = "0.0.9" }
doido-model = { path = "doido-model", version = "0.0.9", default-features = false }
doido-storage = { path = "doido-storage", version = "0.0.9" }
doido-view = { path = "doido-view", version = "0.0.9" }

jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
totp-lite = "2"
ureq = { version = "3", features = ["json"] }

# ORM (version pinned here; doido-model re-exports — import only via doido_model::sea_orm*)
sea-orm = { version = "2.0.1", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "2.0.1", default-features = false, features = [
    "runtime-tokio-rustls",
] }
sea-orm-cli = { version = "2.0.1", default-features = false, features = [
    "cli",
    "codegen",
    "runtime-tokio-rustls",
] }

# Async runtime
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"

# Web
axum        = "0.8"
tower       = { version = "0.5", features = ["util"] }
tower-http  = { version = "0.7", features = ["cors", "catch-panic"] }
http        = "1"
http-body-util = "0.1"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_norway = "0.9"                    # YAML loader shared by config/view/storage

# Typed errors (per-crate derive; see the doido-thiserror-direct-dep note)
thiserror   = "2"

# Crypto / signing (HMAC-SHA256 for signed ids/cookies; digest 0.11 ecosystem)
hmac        = "0.13"
sha2        = "0.11"
base64      = "0.23"

# Proc-macro helpers
syn         = { version = "3", features = ["full"] }
quote       = "1"
proc-macro2 = "1"

# Observability
tracing     = "0.1"

# Utilities
uuid        = { version = "1", features = ["v4"] }
inventory   = "0.3"                     # link-time job registration (Active Job analogue)
clap        = { version = "4", features = ["derive"] }
chrono      = { version = "0.4", features = ["clock"] }
redis       = { version = "1", features = ["tokio-comp", "aio"] }
figlet-rs   = "1.0"
tempfile    = "3"                       # dev-only: temp dirs/files in tests
