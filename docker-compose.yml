# Dev backends for Doido's feature-gated tests — `make services-up` / `make test-backends`.
#
# Redis/postgres/memcache back jobs/cache tests; floci (S3-compatible), azurite,
# and fake-gcs back `make test-storage-backends` (doido-storage provider e2e).
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doido
      POSTGRES_PASSWORD: doido
      POSTGRES_DB: doido_test
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doido"]
      interval: 2s
      timeout: 3s
      retries: 15

  memcache:
    image: memcached:1.6-alpine
    ports: ["11211:11211"]

  floci:
    image: floci/floci:latest-compat
    ports: ["4566:4566"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/storage-emulators/s3-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports: ["10000:10000"]
    command: ["azurite", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--loose"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(10000).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 15

  fake-gcs:
    image: fsouza/fake-gcs-server
    ports: ["4443:4443"]
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4443/storage/v1/b"]
      interval: 2s
      timeout: 3s
      retries: 15
