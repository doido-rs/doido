# Dev stack for chat-websocket. Start with: docker compose up --build
name: chat-websocket

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - ./db:/app/db
    environment:
      DOIDO_ENV: development
      DATABASE__URL: sqlite://db/development.db
      MAILER__TYPE: smtp
      MAILER__SMTP__ADDRESS: mailpit:1025
    depends_on:
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cargo-registry:
  cargo-git:
