# ---------------------------------------------------------------------------
# Theme configuration — Anthropic-inspired palette & layout knobs.
# ---------------------------------------------------------------------------
[extra]
theme_default = "light"

# Brand palette — Brazilian flag green + lemon yellow.
accent = "#0ca84d"
accent_dark = "#12d65a"
accent2 = "#f9f60a"
accent2_dark = "#fbf338"

font_sans = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
font_serif = "'Newsreader', 'Georgia', 'Times New Roman', serif"
font_mono = "'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"

logo_text = "Doido"

repo_url = "https://github.com/doido-rs/doido"
specs_url = "https://github.com/doido-rs/doido/tree/master/docs"

languages = [
    { code = "en", name = "English" },
    { code = "pt", name = "Português" },
    { code = "es", name = "Español" },
]

[[extra.nav]]
name = "Docs"
url = "/docs/"
trans_key = "docs"

[[extra.nav]]
name = "Blog"
url = "/blog/"
