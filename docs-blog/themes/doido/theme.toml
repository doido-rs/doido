name = "doido"
description = "Minimal, configurable docs + blog theme for the Doido framework."
license = "MIT"
homepage = "https://github.com/doido-rs/doido"
min_version = "0.19.0"
demo = "https://doido-rs.github.io"

[author]
name = "Doido contributors"
homepage = "https://github.com/doido-rs/doido"

# Defaults for the theme knobs. The site's config.toml [extra] overrides any of
# these, so the values here are just fallbacks that keep the theme usable when
# dropped into another site.
[extra]
theme_default = "auto"
accent = "#0ca84d"
accent_dark = "#12d65a"
accent2 = "#f9f60a"
accent2_dark = "#fbf338"
font_sans = "system-ui, sans-serif"
font_mono = "ui-monospace, monospace"
logo_text = "doido"
repo_url = "https://github.com/doido-rs/doido"
specs_url = "https://github.com/doido-rs/doido"
