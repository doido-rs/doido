{% extends "base.html" %}

{% block content %}
<section class="hero">
  <div class="container">
    <div class="prose hero-prose">
      {{ section.content | safe }}
    </div>
    <div class="hero-actions">
      <a class="btn btn-primary" href="{{ get_url(path='/docs/') }}">Read the docs</a>
      <a class="btn" href="{{ get_url(path='/blog/') }}">Blog</a>
      <a class="btn" href="{{ config.extra.repo_url }}" rel="noopener" target="_blank">GitHub</a>
    </div>
  </div>
</section>
{% endblock content %}
