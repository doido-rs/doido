[package]
name = "doido-mailer"
description = "Action Mailer analogue: multipart mail, deliver_now/later pluggable backends for Doido."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
doido-mailer-macros.workspace = true
doido-jobs.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "net", "io-util", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
