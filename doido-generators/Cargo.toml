[package]
name = "doido-generators"
description = "Doido code generators plus the unified CLI (server, console, db, worker, generate, new, credentials)."
version.workspace = true
license.workspace = true
edition = "2021"
build = "build.rs"

[lib]
name = "doido_generators"
path = "src/lib.rs"

[[bin]]
name = "doido-generators"
path = "src/main.rs"

[dependencies]
doido-core.workspace = true
doido-controller.workspace = true
doido-model.workspace = true
doido-view.workspace = true
doido-cache.workspace = true
# Enable the db + redis job backends so `doido worker`/`doido jobs` can honour a
# non-default `jobs.type` in config/<env>.yml (not just the in-memory default).
doido-jobs = { workspace = true, features = ["jobs-db", "jobs-redis"] }
chrono.workspace = true
figlet-rs.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["full"] }
include_dir = "0.7"

# The `doido db` command embeds the SeaORM CLI (migrate + entity codegen).
# All three sqlx backends are enabled so a single `doido` binary works against
# whichever database the generated app targets.
sea-orm-cli = { version = "2.0.0", default-features = false, features = [
    "cli",
    "codegen",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
# Light HTTP client for the runtime CRUD e2e (make example).
ureq = { version = "3", features = ["json"] }
serde_json = "1"
