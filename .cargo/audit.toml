[advisories]
ignore = [
    # --- doido-storage Azure backend (azure_core 0.21 chain) ---
    # The S3 backend was migrated to aws-sdk-s3, removing rust-s3 and its quick-xml
    # 0.38 advisories. The remaining advisories below all originate from the opt-in
    # Azure backend (`storage-azure`), which is intentionally kept on the 0.21 SDK:
    # the new azure_storage_blob 1.x only supports Entra ID token auth and drops the
    # account access-key auth doido relies on. azure_* 0.21 pins vulnerable deps
    # (quick-xml ^0.31, http-types 2.12, rand 0.7, ...) with no in-line fix, and a
    # [patch] to quick-xml 0.41 is not viable (breaking API azure_core calls). The
    # quick-xml DoS only applies to XML received from the *configured* Azure endpoint
    # (a trusted backend), so practical exposure is low. Revisit if the Azure SDK
    # ships account-key auth on a modern stack. (Mirrors deny.toml.)
    "RUSTSEC-2026-0194", # quick-xml 0.31: quadratic runtime on duplicate attrs (azure_core)
    "RUSTSEC-2026-0195", # quick-xml 0.31: unbounded namespace-decl alloc DoS (azure_core)
    "RUSTSEC-2026-0174", # http-types: Authorization/WwwAuthenticate ASCII invariant (azure_core)
    "RUSTSEC-2026-0097", # rand 0.7: unsound with custom logger (azure_core -> http-types)
    "RUSTSEC-2024-0384", # instant: unmaintained (azure_core -> http-types -> fastrand)
    "RUSTSEC-2024-0436", # paste: unmaintained (azure_core)
]
