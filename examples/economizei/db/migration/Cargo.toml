[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
# SeaORM migration helpers via the doido meta crate (`doido::model::sea_orm_migration`).
# This crate is a library: the app links its `Migrator` and runs it in-process.
doido = { version = "0.0.24", default-features = false, features = ["postgres"] }
