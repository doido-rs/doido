server:
  bind: 0.0.0.0
  port: 8080
database:
  # The connection string comes from the DATABASE_URL environment variable at
  # deploy time; the default below is used when it is unset.
  url: '{{ get_env(name="DATABASE_URL", default="sqlite://db/production.db") }}'
logger:
  # Quieter logging in production. Override at deploy time with RUST_LOG.
  level: info
  # Structured access logs: one JSON line per response (status, latency_ms,
  # request_id). Override at deploy time with RUST_LOG if you need more.
  format: json_response
cache:
  type: memory
jobs:
  type: db
  queues: [default]
  concurrency: 5
storage:
  driver: local
  drivers:
    local:
      type: disk
      root: storage
    test:
      type: memory
