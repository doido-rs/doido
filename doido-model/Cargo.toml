[package]
name = "doido-model"
description = "SeaORM re-exports plus connection pooling and model testing helpers for Doido apps."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
sea-orm = { version = "2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
url = "2"
bcrypt = "0.19"
uuid = { workspace = true }

[features]
default = ["sqlite"]
sqlite = [
    "sea-orm/sqlx-sqlite",
    "sea-orm-migration/sqlx-sqlite",
]
postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm-migration/sqlx-postgres",
]
mysql = [
    "sea-orm/sqlx-mysql",
    "sea-orm-migration/sqlx-mysql",
]

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
