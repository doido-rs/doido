[package]
name = "doido-model"
description = "SeaORM re-exports plus connection pooling and model testing helpers for Doido apps."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
sea-orm-cli = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
url = "2"
bcrypt = "0.19"
uuid = { workspace = true }

[features]
default = ["sqlite"]
cli = ["dep:sea-orm-cli", "sea-orm-migration/cli"]
sqlite = [
    "sea-orm/sqlx-sqlite",
    "sea-orm-migration/sqlx-sqlite",
    "sea-orm-cli?/sqlx-sqlite",
]
postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm-migration/sqlx-postgres",
    "sea-orm-cli?/sqlx-postgres",
]
mysql = [
    "sea-orm/sqlx-mysql",
    "sea-orm-migration/sqlx-mysql",
    "sea-orm-cli?/sqlx-mysql",
]

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
