[package]
name = "doido-model"
description = "SeaORM re-exports plus connection pooling and model testing helpers for Doido apps."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
# `with-*` value types expose the sea_orm prelude aliases the model generator
# emits (Decimal/DateTime/Date/Json/Uuid). `with-json` also turns on
# chrono/rust_decimal/uuid `serde`, so the generated model's derive(Serialize,
# Deserialize) works — the four must be enabled together.
sea-orm = { workspace = true, features = [
    "with-chrono",
    "with-rust_decimal",
    "with-uuid",
    "with-json",
] }
sea-orm-migration.workspace = true
sea-orm-cli = { workspace = true, optional = true }
sea-schema = { version = "0.18", default-features = false, optional = true }
sqlx = { version = "0.9", default-features = false, optional = true }
clap = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
url = "2"
bcrypt = "0.19"
uuid = { workspace = true }

[features]
default = ["sqlite"]
cli = [
    "dep:sea-orm-cli",
    "dep:clap",
    "dep:sea-schema",
    "dep:sqlx",
    "sea-orm-migration/cli",
]
sqlite = [
    "sea-orm/sqlx-sqlite",
    "sea-orm-migration/sqlx-sqlite",
    "sea-orm-cli?/sqlx-sqlite",
    "sea-schema?/sqlx-sqlite",
    "sqlx?/sqlite",
    "sqlx?/runtime-tokio",
]
postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm-migration/sqlx-postgres",
    "sea-orm-cli?/sqlx-postgres",
    "sea-schema?/sqlx-postgres",
    "sqlx?/postgres",
    "sqlx?/runtime-tokio",
    "sqlx?/tls-rustls",
]
mysql = [
    "sea-orm/sqlx-mysql",
    "sea-orm-migration/sqlx-mysql",
    "sea-orm-cli?/sqlx-mysql",
    "sea-schema?/sqlx-mysql",
    "sqlx?/mysql",
    "sqlx?/runtime-tokio",
    "sqlx?/tls-rustls",
]

[dev-dependencies]
tokio.workspace = true
tempfile = "3"

[[test]]
name = "schema_design_test"
path = "tests/schema_design_test.rs"
required-features = ["cli"]
