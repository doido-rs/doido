[package]
name = "doido-jobs"
description = "Background queues (memory/redis/db workers) — Active Job analogue for Doido."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
doido-jobs-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "signal"] }
async-trait.workspace = true
uuid.workspace = true
inventory.workspace = true
base64.workspace = true
clap = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
cron.workspace = true
doido-model = { workspace = true, optional = true, default-features = false }
doido-view = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
subtle = { version = "2", optional = true }

[features]
default = []
webui = [
    "dep:doido-view",
    "dep:axum",
    "dep:http",
    "dep:tower",
    "dep:subtle",
]
sqlite = ["doido-model?/sqlite"]
postgres = ["doido-model?/postgres"]
mysql = ["doido-model?/mysql"]
jobs-db = ["dep:doido-model"]
jobs-redis = ["dep:redis"]
cli = ["dep:clap"]

[[test]]
name = "jobs_commands_test"
required-features = ["cli", "jobs-db"]

[[test]]
name = "worker_command_test"
required-features = ["cli", "jobs-db"]

[[test]]
name = "db_mysql_concurrency_test"
required-features = ["jobs-db", "mysql"]

[[test]]
name = "webui_test"
required-features = ["webui", "jobs-db", "sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
doido-model = { workspace = true, features = ["sqlite"] }
uuid.workspace = true
tempfile = "3"
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
