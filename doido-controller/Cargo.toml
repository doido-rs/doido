[package]
name = "doido-controller"
description = "Action Controller + routing + Tower middleware for Doido: handlers, Context, responses, filters, routes! DSL, sessions, and middleware stacks."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
doido-controller-macros.workspace = true
doido-model = { workspace = true, default-features = false }
doido-view.workspace = true
doido-cache.workspace = true
async-trait.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["full"] }
tower-http.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
http.workspace = true
serde_urlencoded = "0.7"
uuid.workspace = true
# Cookie session signing (HMAC-SHA256). Versions match crates already in the tree
# (pulled by sea-orm/sqlx), so this adds no new dependency versions.
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
subtle = "2"

[features]
default = []
sqlite = ["doido-model/sqlite"]
postgres = ["doido-model/postgres"]
mysql = ["doido-model/mysql"]

[dev-dependencies]
http-body-util.workspace = true
tokio.workspace = true
tempfile.workspace = true
doido-model = { workspace = true, features = ["sqlite"] }
