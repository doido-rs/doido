[package]
name = "doido-controller"
description = "Action Controller + routing + Tower middleware for Doido: handlers, Context, responses, filters, routes! DSL, sessions, and middleware stacks."
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
doido-core.workspace = true
doido-controller-macros.workspace = true
doido-model.workspace = true
doido-view.workspace = true
async-trait.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["full"] }
tower-http.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9"
http.workspace = true
serde_urlencoded = "0.7"
uuid.workspace = true
# Cookie session signing (HMAC-SHA256). Versions match crates already in the tree
# (pulled by sea-orm/sqlx), so this adds no new dependency versions.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"

[dev-dependencies]
http-body-util.workspace = true
tokio.workspace = true
tempfile = "3"
